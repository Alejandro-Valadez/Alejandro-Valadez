  </g>

  <g transform="translate(990,150)" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity="0.85">
    <ellipse rx="150" ry="55" transform="rotate(0)"/>
    <ellipse rx="150" ry="55" transform="rotate(60)"/>
