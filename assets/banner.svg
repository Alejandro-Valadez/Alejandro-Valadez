    <circle cx="300" cy="24" r="1"/>
    <circle cx="470" cy="52" r="1.4"/>
    <circle cx="620" cy="20" r="1"/>
    <circle cx="700" cy="70" r="1.2"/>
    <circle cx="150" cy="270" r="1"/>
    <circle cx="360" cy="280" r="1.2"/>
